<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl shadow-slate-300/40 p-8">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-blue-600 text-white text-xl font-bold">
        G
      </div>
      <h1 class="text-2xl font-semibold text-slate-800">Đăng nhập GMS</h1>
      <p class="mt-1 text-sm text-slate-500">Hệ thống quản lý gara</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">
          Tên đăng nhập
        </label>
        <input
          id="username"
          name="username"
          [(ngModel)]="username"
          required
          autocomplete="username"
          class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-800 placeholder-slate-400 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
          placeholder="Nhập tên đăng nhập"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">
          Mật khẩu
        </label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-800 placeholder-slate-400 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
          placeholder="Nhập mật khẩu"
        />
      </div>

      @if (errorMessage()) {
        <div class="rounded-lg bg-red-50 border border-red-200 px-3.5 py-2.5 text-sm text-red-700">
          {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg bg-blue-600 px-4 py-2.5 font-medium text-white transition hover:bg-blue-700 focus:ring-2 focus:ring-blue-500/40 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>
  </div>
</div>
