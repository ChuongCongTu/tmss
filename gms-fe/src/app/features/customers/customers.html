<div class="min-h-screen bg-slate-50">
  <!-- Top bar -->
  <header class="bg-white border-b border-slate-200">
    <div class="mx-auto max-w-5xl px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-white font-bold">
          G
        </div>
        <div>
          <h1 class="text-lg font-semibold text-slate-800">GMS</h1>
          <p class="text-xs text-emerald-600 font-medium">● Đã đăng nhập</p>
        </div>
      </div>
      <button
        (click)="logout()"
        class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
      >
        Đăng xuất
      </button>
    </div>
  </header>

  <!-- Content -->
  <main class="mx-auto max-w-5xl px-6 py-8">
    <div class="mb-5 flex items-center justify-between">
      <h2 class="text-xl font-semibold text-slate-800">Danh sách khách hàng</h2>
      <span class="rounded-full bg-blue-100 px-3 py-1 text-sm font-medium text-blue-700">
        {{ customers.length }} khách hàng
      </span>
    </div>

    @if (error) {
      <div class="mb-5 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
        {{ error }}
      </div>
    }

    <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 text-slate-500 uppercase text-xs tracking-wide">
          <tr>
            <th class="px-6 py-3 font-medium">Họ tên</th>
            <th class="px-6 py-3 font-medium">Số điện thoại</th>
            <th class="px-6 py-3 font-medium">Địa chỉ</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (c of customers; track c.id) {
            <tr class="transition hover:bg-slate-50">
              <td class="px-6 py-3.5 font-medium text-slate-800">{{ c.fullName }}</td>
              <td class="px-6 py-3.5 text-slate-600">{{ c.phone || '—' }}</td>
              <td class="px-6 py-3.5 text-slate-600">{{ c.address || '—' }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="px-6 py-10 text-center text-slate-400">
                Chưa có khách hàng nào.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </main>
</div>
