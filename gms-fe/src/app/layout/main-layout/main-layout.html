<div class="flex min-h-screen bg-slate-50">
  <!-- Sidebar -->
  <aside class="flex w-60 flex-col border-r border-slate-200 bg-white">
    <!-- Logo -->
    <div class="flex items-center gap-3 border-b border-slate-200 px-6 py-4">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-white font-bold">
        G
      </div>
      <h1 class="text-lg font-semibold text-slate-800">GMS</h1>
    </div>

    <!-- Menu -->
    <nav class="flex-1 space-y-1 p-3">
      @for (item of menu; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-blue-50 text-blue-600"
          class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <!-- Main -->
  <div class="flex flex-1 flex-col">
    <!-- Topbar -->
    <header class="flex items-center justify-end border-b border-slate-200 bg-white px-6 py-3">
      <div class="flex items-center gap-4">
        <p class="text-xs text-emerald-600 font-medium">● Đã đăng nhập</p>
        <button
          (click)="logout()"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
        >
          Đăng xuất
        </button>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-auto">
      <router-outlet />
    </main>
  </div>
</div>
